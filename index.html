<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CG — Administration du catalogue</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#07070f" />
<link rel="icon" type="image/png" href="logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090e; --panel:#0b1019; --panel2:#0f141f; --line:#ffffff1f; --line2:#ffffff47;
  --g1:var(--g1); --g2:var(--g2); --text:#e2e8f0; --muted:#94a3b8; --danger:#f43f5e; --ok:#a3e635;
  --font:system-ui,-apple-system,'Segoe UI',Roboto,Ubuntu,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---------- fond ---------- */
.grad{padding-right:.1em;background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- barre du haut ---------- */
.top{position:fixed;z-index:50;left:0;top:0;width:100%;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:linear-gradient(to bottom,#000000bf,#00000059,transparent)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:36px;height:36px;object-fit:contain}
.brand b{display:block;font-size:18px;font-style:italic;text-transform:uppercase;letter-spacing:.12em;line-height:1}
.brand small{display:block;margin-top:3px;font-size:11px;letter-spacing:.18em;color:#ffffff73;line-height:1}
.who{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}

/* ---------- boutons ---------- */
.cta,.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:.45em;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;transition:filter .2s,transform .2s,background .2s,border-color .2s,color .2s;text-decoration:none}
.cta{color:#07090e;border:1px solid transparent;background:linear-gradient(90deg,var(--g1),var(--g2))}
.cta:hover{filter:brightness(1.08);transform:translateY(-1px)}
.cta[disabled]{opacity:.5;cursor:wait;transform:none}
.ghost{color:#f4f4f5bf;background:transparent;border:1px solid var(--line2)}
.ghost:hover{color:#fff;background:#ffffff0a;border-color:#ffffff80}
.ghost.danger:hover{color:var(--danger);border-color:var(--danger)}
.pend{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:0 0 16px;padding:14px 16px;border:1px solid #f59e0b66;background:#f59e0b14;border-radius:.6em}
.pend b{font-size:14px}.pend small{display:block;font-size:12px;color:#ffffffa6;margin-top:2px}.pend .grow{flex:1;min-width:160px}
.st{display:inline-block;font-style:normal;margin-left:10px;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;vertical-align:middle;background:#f59e0b26;color:#fbbf24;border:1px solid #f59e0b66}
.st.del{background:#f43f5e22;color:#fb7185;border-color:#f43f5e66}
li.isdel .thumb,li.isdel .ttl{opacity:.45}
.hsec{margin:0 0 40px}.hsec h3{margin:0 0 4px;font-size:20px;font-style:italic;text-transform:uppercase;font-weight:800}
.hsec .sub{margin:0 0 14px;font-size:13px;color:var(--muted);line-height:1.5}
.hsec .auto{padding:18px;border:1px dashed #ffffff29;border-radius:.6em;color:var(--muted);font-size:13px;line-height:1.5}
.hadd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}.hadd .fi{max-width:360px}
.sm{padding:7px 12px;font-size:11px}
.adm{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 4px;border-top:1px solid #ffffff14}
.adm:last-child{border-bottom:1px solid #ffffff14}
.adm .who2{flex:1;min-width:220px}.adm .who2 b{font-size:15px}.adm .who2 code{margin-left:8px;font-size:11px;color:#ffffff73}
.adm .who2 small{display:block;margin-top:3px;font-size:12px;color:var(--muted)}
.adm .pc{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.adm .pc span{font-size:10px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:99px;border:1px solid color-mix(in srgb,var(--g1) 33%,transparent);background:color-mix(in srgb,var(--g1) 8%,transparent);color:color-mix(in srgb,var(--g1) 40%,white)}
.adm .pc span.off{border-color:#ffffff1f;background:transparent;color:#ffffff4d;text-decoration:line-through}
.afrm{margin-top:24px;padding:18px;border:1px solid var(--line);border-radius:.6em;background:#0000002e}
.afrm h4{margin:0 0 14px;font-size:14px;text-transform:uppercase;letter-spacing:.06em}
.afrm .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px}
@media (max-width:700px){.afrm .row{grid-template-columns:1fr}}
.pill{display:inline-flex;align-items:center;gap:.45em;padding:.3em .75em;font-size:12px;color:#f4f4f5b3;background:color-mix(in srgb,var(--g1) 8%,transparent);border:1px solid color-mix(in srgb,var(--g1) 35%,transparent);border-radius:.45em}
.pill b{color:var(--g1);font-weight:600}

/* ---------- écran de connexion ---------- */
.center{position:relative;z-index:10;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:96px 16px 40px;text-align:center}
.hero h1{margin:18px 0 0;font-size:clamp(2.4rem,9vw,5.5rem);font-style:italic;text-transform:uppercase;font-weight:800;line-height:1.02;letter-spacing:-.01em}
.hero h1 span{display:block}
.hero p{max-width:440px;margin:18px auto 0;color:#ffffff8c;font-size:15px;line-height:1.6}
.hero .cta{margin-top:30px;padding:14px 28px}
.note{margin-top:18px;font-size:12px;color:var(--muted)}
.msg{margin:22px auto 0;max-width:440px;padding:12px 16px;border-radius:.6em;font-size:13px;border:1px solid var(--line);background:#080a0e8c}
.msg.err{border-color:#f43f5e66;color:#fda4af}

/* ---------- mise en page ---------- */
.layout{position:relative;z-index:10;min-height:100vh;display:grid;grid-template-columns:16rem minmax(0,1fr);padding-top:64px}
aside{position:sticky;top:64px;align-self:start;height:calc(100vh - 64px);padding:24px 12px 24px 24px;overflow-y:auto}
aside nav{display:flex;flex-direction:column;gap:6px}
.tab{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:.45em;border:1px solid transparent;background:transparent;color:#ffffff8c;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;text-align:left;transition:all .2s}
.tab:hover{border-color:#ffffff12;background:#ffffff09;color:#fff}
.tab.on{border-color:color-mix(in srgb,var(--g1) 35%,transparent);background:color-mix(in srgb,var(--g1) 9%,transparent);color:#fff}
.tab.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:99px;background:linear-gradient(to bottom,var(--g1),var(--g2))}
.tab .n{margin-left:auto;font-size:11px;color:#ffffff59;font-variant-numeric:tabular-nums}
.tab svg{flex:none;width:18px;height:18px}
.tab.on svg{color:var(--g1)}
main{padding:28px 24px 80px;min-width:0}
.wrap{max-width:62rem;margin:0 auto}
.head{position:relative;padding:8px 0 28px}
.big{position:absolute;left:-6px;top:-.35em;font-size:clamp(6rem,13vw,10rem);font-weight:800;font-style:italic;line-height:1;color:transparent;-webkit-text-stroke:1.5px var(--g1);opacity:.25;pointer-events:none;user-select:none}
.head .pill{position:relative}
.head h2{position:relative;margin:0;font-size:clamp(2.2rem,5vw,3.8rem);font-style:italic;text-transform:uppercase;font-weight:800;line-height:.95}
.head p{position:relative;margin:14px 0 0;max-width:420px;color:#ffffff8c;font-size:14px;line-height:1.6}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 18px}
.bar .grow{flex:1}
.selbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 14px;padding:10px 14px;border:1px solid var(--line2);border-radius:.6em;background:#ffffff08}
.selbar .cnt{font-size:13px;font-weight:700;margin-right:auto}
.selbar .dangerfill{background:#f43f5e;color:#fff;border:0}
.selbar .dangerfill:disabled{opacity:.4;cursor:not-allowed}
ol.list li.selectable{cursor:pointer}
ol.list li.picked{background:#f43f5e14}
.rowchk{width:18px;height:18px;accent-color:#f43f5e;flex:none;cursor:pointer}
.search{min-width:0;flex:1;max-width:320px}

/* ---------- liste ---------- */
ol.list{list-style:none;margin:0;padding:0}
ol.list li{position:relative;display:flex;align-items:center;gap:16px;padding:14px 4px;border-top:1px solid #ffffff14}
ol.list li:last-child{border-bottom:1px solid #ffffff14}
ol.list li::before{content:"";position:absolute;top:-1px;left:0;height:1px;width:0;background:linear-gradient(90deg,var(--g1),var(--g2));transition:width .3s}
ol.list li:hover::before{width:100%}
.idx{width:28px;flex:none;font-size:12px;font-weight:600;color:#ffffff4d;font-variant-numeric:tabular-nums;transition:color .2s}
li:hover .idx{color:var(--g1)}
.thumb{width:44px;height:58px;flex:none;border-radius:.4em;object-fit:cover;background:#0f141f;border:1px solid var(--line)}
.ttl{min-width:0;flex:1}
.ttl b{display:block;font-size:17px;font-style:italic;text-transform:uppercase;font-weight:700;color:#ffffffd9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .2s,color .2s}
li:hover .ttl b{transform:translateX(4px);color:#fff}
.ttl span{display:block;margin-top:3px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:8px;flex:none}
.empty{padding:44px 20px;border:1.5px dashed #ffffff47;border-radius:.9rem;background:#0000002e;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
.empty b{display:block;color:#fff;margin-bottom:4px}

/* ---------- fenêtre / formulaire ---------- */
.overlay{position:fixed;inset:0;z-index:100;background:#000000b3;display:flex;align-items:flex-start;justify-content:center;padding:32px 12px;overflow-y:auto}
.modal{width:100%;max-width:46rem;background:#10151f;border:1px solid #ffffff24;border-radius:.6em;box-shadow:0 1.5em 3em #0000008c}
.modal.sm2{max-width:26rem}
.mh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.mh h3{margin:0;font-size:18px;font-style:italic;text-transform:uppercase;letter-spacing:.04em}
.x{width:34px;height:34px;border-radius:.4em;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:18px;line-height:1}
.x:hover{color:#fff;border-color:var(--line2)}
.mb{padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mb .full{grid-column:1/-1}
.mf{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line);flex-wrap:wrap}
label.f{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
label.f i{color:var(--g1);font-style:normal}
.fi{width:100%;padding:11px 12px;color:#fff;font:inherit;font-size:14px;background:#080a0ec7;border:1px solid #ffffff24;border-radius:.5rem;outline:none;transition:border-color .15s}
.fi:focus{border-color:color-mix(in srgb,var(--g1) 55%,transparent)}
textarea.fi{resize:vertical;min-height:96px;line-height:1.5}
.autonote{grid-column:1/-1;padding:10px 12px;border-radius:.5em;border:1px solid color-mix(in srgb,var(--g1) 27%,transparent);background:color-mix(in srgb,var(--g1) 7%,transparent);color:color-mix(in srgb,var(--g1) 40%,white);font-size:13px;line-height:1.55}
.autonote.warn{border-color:#fbbf2455;background:#fbbf2412;color:#fde68a}
.autonote ul{margin:6px 0 0;padding-left:18px}
.hint{margin-top:5px;font-size:11px;color:#ffffff59;line-height:1.4}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:.45em;font-size:13px;color:#ffffffb3;cursor:pointer;user-select:none;background:#080a0e8c}
.chk:has(input:checked){border-color:color-mix(in srgb,var(--g1) 45%,transparent);background:color-mix(in srgb,var(--g1) 8%,transparent);color:#fff}
.chk input{accent-color:var(--g1)}
.imgprev{margin-top:8px;max-height:110px;max-width:100%;border-radius:.4em;border:1px solid var(--line);display:block}
details.adv{grid-column:1/-1;border:1px solid var(--line);border-radius:.6em;background:#0000002e}
details.adv summary{padding:12px 14px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer}
details.adv .in{padding:4px 14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.err{margin:0 22px 14px;padding:10px 12px;border-radius:.5em;border:1px solid #f43f5e66;background:#f43f5e14;color:#fda4af;font-size:13px}

.toast{position:fixed;z-index:200;left:50%;bottom:24px;transform:translateX(-50%);max-width:92vw;padding:12px 18px;border-radius:.6em;background:#10151f;border:1px solid color-mix(in srgb,var(--g1) 35%,transparent);box-shadow:0 12px 32px #0008;font-size:13px}
.toast.bad{border-color:#f43f5e80;color:#fda4af}

@media (max-width:900px){
  .layout{grid-template-columns:1fr;grid-template-rows:max-content 1fr;align-content:start}
  aside{position:static;height:auto;padding:12px 12px 0}
  aside nav{flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .tab{width:auto;white-space:nowrap;padding:10px 12px;font-size:12px}
  main{padding:12px 16px 80px}
  .mb,details.adv .in{grid-template-columns:1fr}
  .who span{display:none}
}
@media (max-width:560px){
  .thumb{display:none}
  .acts{flex-direction:column}
  .ttl b{font-size:15px}
}

/* ================= DA v2 : thème violet étoilé (même univers que le site CG) ================= */
:root{
  --accent:#7c5cff; --accent-2:#c06bff;
  --g1:var(--accent); --g2:var(--accent-2);
  --bg:#07070f; --card:rgba(20,20,38,.62); --panel:rgba(14,14,28,.92);
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.2);
  --text:#ecebff; --muted:#9b9ab8;
  --font:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:"Space Grotesk",Inter,system-ui,sans-serif;
  --glow:0 0 0 1px rgba(255,255,255,.06),0 20px 60px -24px color-mix(in srgb,var(--accent) 55%,transparent);
  --r:18px;
}
body.no-anim *{animation:none!important;transition:none!important}
/* Barre de défilement dans la D.A : invisible au repos, apparaît quand on défile, suit la couleur choisie ; la place est réservée (plus de décalage) */
html{scrollbar-gutter:stable}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track,*::-webkit-scrollbar-corner{background:transparent}
*::-webkit-scrollbar-thumb{border-radius:99px;border:2px solid transparent;background:transparent padding-box;transition:background .35s}
html.scrolling *::-webkit-scrollbar-thumb,*::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--g1),var(--g2)) padding-box}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:transparent transparent}html.scrolling *{scrollbar-color:var(--g1) transparent}}

html{background:var(--bg)}
body{background:transparent;line-height:1.6}
h1,h2,h3,h4,.brand b,.tab,.cta,.ghost,.big,.ttl b,.pill{font-family:var(--display)}
.nebula{position:fixed;inset:-20%;z-index:-3;pointer-events:none;
  background:
    radial-gradient(40% 35% at 20% 15%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%),
    radial-gradient(35% 30% at 85% 30%,color-mix(in srgb,var(--accent-2) 16%,transparent),transparent 70%),
    radial-gradient(50% 40% at 50% 110%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%),
    var(--bg);
  animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(-3%,2%,0) scale(1.05)}}
#stars{position:fixed;inset:0;z-index:-2;display:block;pointer-events:none}

/* barre du haut */
.top{height:68px;padding:0 24px;background:rgba(7,7,15,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand img{width:auto;height:30px}
.brand b{font-style:normal;text-transform:none;letter-spacing:-.02em;font-size:1.15rem;font-weight:700}
.brand small{letter-spacing:.2em;color:var(--muted);font-size:10px}
.topr{display:flex;align-items:center;gap:12px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);font-size:18px;padding:0}
.icon-btn:hover{background:rgba(255,255,255,.1)}
.layout{padding-top:68px}
@media (min-width:901px){aside{top:68px;height:calc(100vh - 68px)}}

/* boutons */
.cta,.ghost{border-radius:12px;font-size:14px;font-weight:600;letter-spacing:0;text-transform:none;padding:11px 20px}
.cta{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 10px 30px -12px var(--accent)}
.cta:hover{filter:none;transform:translateY(-2px);box-shadow:0 14px 36px -10px var(--accent)}
.ghost{color:var(--text);background:rgba(255,255,255,.05);border:1px solid var(--line)}
.ghost:hover{background:rgba(255,255,255,.1);border-color:var(--line2)}
.sm{padding:8px 14px;font-size:13px}
.pill{border-radius:999px;padding:6px 14px;font-size:.74rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:color-mix(in srgb,var(--accent) 40%,white)}
.pill b{color:inherit;font-weight:600}

/* titres */
.hero h1,.head h2,.hsec h3,.mh h3{font-style:normal;text-transform:none;letter-spacing:-.02em}
.hero h1{font-size:clamp(2.3rem,7vw,3.8rem);line-height:1.05;font-weight:700}
.head h2{font-size:clamp(2.2rem,5vw,3.4rem);font-weight:700;line-height:1.05}
.hsec h3{font-size:1.4rem;font-weight:700}
.mh h3{font-size:1.15rem;font-weight:600;letter-spacing:-.01em}
.big{font-style:normal;-webkit-text-stroke:1.5px var(--accent);opacity:.16}
.hero p,.head p{color:var(--muted)}

/* carte de connexion */
.center .hero{max-width:640px;padding:46px 40px;border-radius:24px;background:var(--card);border:1px solid var(--line);box-shadow:var(--glow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.msg{background:rgba(8,8,18,.6);border-radius:12px}

/* navigation */
.tab{font-size:14px;font-weight:600;letter-spacing:0;text-transform:none;border-radius:12px;color:var(--muted)}
.tab:hover{background:rgba(255,255,255,.06);border-color:var(--line)}
.tab.on{color:#fff;border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:color-mix(in srgb,var(--accent) 16%,transparent)}

/* liste en cartes de verre */
ol.list li{padding:12px 16px;margin:0 0 10px;border:1px solid var(--line);border-radius:14px;background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:border-color .25s,box-shadow .25s,background .25s;overflow:hidden}
ol.list li:last-child{border-bottom:1px solid var(--line)}
ol.list li::before{display:none}
ol.list li::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.07),transparent 60%)}
ol.list li:hover{border-color:color-mix(in srgb,var(--accent) 45%,transparent);box-shadow:var(--glow)}
ol.list li:hover::after{opacity:1}
ol.list li.picked{background:color-mix(in srgb,#f43f5e 12%,var(--card))}
.thumb{border-radius:10px;background:rgba(15,15,32,.8)}
.ttl b{font-style:normal;text-transform:none;font-size:1.02rem;font-weight:600;letter-spacing:-.01em;color:var(--text)}
li:hover .ttl b{transform:translateX(3px);color:#fff}
.idx{color:var(--muted)}
.adm{border-top:0;padding:14px 16px;margin:0 0 10px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.adm:last-child{border-bottom:1px solid var(--line)}
.adm .pc span{border-color:color-mix(in srgb,var(--accent) 35%,transparent);background:color-mix(in srgb,var(--accent) 12%,transparent);color:color-mix(in srgb,var(--accent) 35%,white)}

/* blocs en verre */
.pend,.selbar,.empty,.afrm,.hsec .auto{border-radius:var(--r);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pend{background:rgba(245,158,11,.1)}
.selbar{background:var(--card);border-color:var(--line)}
.empty{background:var(--card);border:1.5px dashed var(--line2)}
.afrm{background:rgba(8,8,18,.45);border-color:var(--line)}
.hsec .auto{background:rgba(8,8,18,.35);border-color:var(--line2)}
.overlay{background:rgba(3,3,10,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal{background:rgba(16,16,31,.94);border:1px solid var(--line);border-radius:22px;box-shadow:var(--glow),0 30px 80px -20px #000;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.x{border-radius:10px}
.fi{border-radius:12px;background:rgba(8,8,18,.6);border-color:var(--line)}
.fi:focus{border-color:color-mix(in srgb,var(--accent) 65%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
label.f{letter-spacing:.08em}
.chk{border-radius:12px;background:rgba(8,8,18,.5)}
.chk:has(input:checked){border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.chk input,.rowchk{accent-color:var(--accent)}
.rowchk{accent-color:#f43f5e}
details.adv{border-radius:14px}
.toast{border-radius:14px;background:rgba(16,16,31,.95);backdrop-filter:blur(14px);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.toast.bad{border-color:rgba(244,63,94,.55)}
.autonote{border-radius:12px}

/* effet 3D (survol) */
.tilting{transition:transform .08s linear,border-color .25s,box-shadow .25s!important}
.tilt-on{transition:transform .5s cubic-bezier(.2,.8,.2,1),border-color .25s,box-shadow .25s}

/* ============ panneau Personnaliser ============ */
.panel{position:fixed;top:80px;right:16px;width:min(300px,calc(100vw - 32px));max-height:calc(100vh - 100px);overflow-y:auto;z-index:150;padding:22px;border-radius:var(--r);background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 30px 80px -20px #000;
  transform:translateX(130%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.panel.open{transform:none}
.panel h4{font-size:1.05rem;margin:0}
.panel .lbl{font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.panel .row{display:flex;align-items:center;justify-content:space-between;font-size:.9rem;margin:8px 0}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:9px;border:2px solid transparent;padding:0}
.sw.on{border-color:#fff}
.panel input[type=range]{width:130px;accent-color:var(--accent)}
.toggle{width:40px;height:22px;border-radius:99px;background:#2a2a40;position:relative;transition:background .2s;border:0;padding:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on{background:var(--accent)}
.toggle.on::after{transform:translateX(18px)}
@media (max-width:900px){.top{padding:0 14px}.brand small{display:none}}
@media (prefers-reduced-motion:reduce){.nebula{animation:none}}
@media (max-width:560px){.fi.search{flex:1 1 100%;width:100%!important}}

/* ===== Affichage en carrés + chargement par 20 ===== */
.seg{display:inline-flex;padding:3px;gap:2px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.seg button{all:unset;cursor:pointer;display:grid;place-items:center;width:34px;height:30px;border-radius:9px;color:var(--muted);transition:background .25s,color .25s}
.seg button:hover{color:#fff}
.seg button.on{color:#fff;background:color-mix(in srgb,var(--accent) 28%,transparent)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
ol.list.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
ol.list.grid li{flex-direction:column;align-items:stretch;gap:10px;margin:0;padding:10px;border-top:1px solid var(--line)}
ol.list.grid .idx{display:none}
ol.list.grid .thumb{display:block;width:100%;height:auto;aspect-ratio:460/215;border-radius:10px;object-fit:cover}
ol.list.grid.media .thumb{aspect-ratio:2/3;object-position:center}
ol.list.grid .ttl{flex:none;padding:0 2px}
ol.list.grid .ttl b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal;overflow:hidden;font-size:.95rem;line-height:1.3;min-height:2.6em}
ol.list.grid li:hover .ttl b{transform:none}
ol.list.grid .ttl span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal;overflow:hidden;min-height:2.4em}
ol.list.grid .st{position:absolute;top:18px;left:18px;margin:0;z-index:2;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
ol.list.grid .acts{width:100%}
ol.list.grid .acts button{flex:1;padding-left:8px;padding-right:8px}
ol.list.grid .rowchk{position:absolute;top:18px;right:18px;z-index:3;margin:0;width:18px;height:18px}
ol.list li.fresh{animation:cardIn .45s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--d,0)*35ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.96)}}
.more{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:18px 0 6px}
.more small{opacity:.7;font-weight:500;margin-left:4px}
.more .mcnt{font-size:12px;color:var(--muted)}
::view-transition-group(*){animation-duration:.3s;animation-timing-function:cubic-bezier(.3,.7,.2,1)}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(*),::view-transition-new(*){height:100%;object-fit:cover;animation-duration:.3s}
html.vting ol.list li,html.vting ol.list li *{transition:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
html.vting ol.list li{box-shadow:none!important}
body.no-anim ol.list li.fresh{animation:none!important}
.mb .free{align-self:end}
</style>
</head>

function createTunnel(cv){
 const gl=cv.getContext('webgl2',{premultipliedAlpha:true,alpha:true,antialias:false});
 if(!gl)return{draw(){},ok:false};
 const MAX=7000;
 const vs=`#version 300 es
in vec4 aSeed;uniform float uPh,uSize,uDpr,uRev,uSp;uniform int uMode;uniform vec2 uRes,uDir;uniform vec3 uC1,uC2;uniform float uTint;

 }else{
  float qy=aSeed.y+uDir.y*uPh*5.0*(0.5+aSeed.z);k=floor(qy);vec2 p=vec2(fract(aSeed.x+hsh(k+aSeed.w*131.0)),fract(qy));

 }

 const sh=(t,s)=>{const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(x));return x};

/* ===== Utilitaires ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => (/^https:\/\//i.test(u || '') ? u : '');
const store = {
  get(k){ try{ return sessionStorage.getItem(k) }catch{ return null } },
  set(k,v){ try{ sessionStorage.setItem(k,v) }catch{} },
  del(k){ try{ sessionStorage.removeItem(k) }catch{} },
};
let token = null, catalog = { version: 0, items: { games:[], software:[], graphics:[], media:[] } }, current = 'games', filter = '', selMode = false, picked = new Set();

function toast(text, bad){
  const t = $('#toast'); t.textContent = text; t.className = 'toast' + (bad ? ' bad' : '');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.add('hidden'), 5000);
}
async function api(path, body){
  const res = await fetch(CATALOG_URL + path, body
    ? { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ accessToken: token, ...body }) }
    : undefined);
  let data = {}; try { data = await res.json(); } catch {}
  if (!res.ok) { const e = new Error(data.error || 'Erreur ' + res.status); e.status = res.status; throw e; }
  return data;
}

/* ===== Connexion Discord ===== */
const redirectUri = () => location.origin + location.pathname;
function startLogin(){
  const state = crypto.getRandomValues(new Uint32Array(4)).join('-');
  store.set('cg_state', state);
  location.href = 'https://discord.com/oauth2/authorize?client_id=' + CLIENT_ID +
    '&response_type=token&redirect_uri=' + encodeURIComponent(redirectUri()) +
    '&scope=' + encodeURIComponent('identify') + '&state=' + encodeURIComponent(state);
}
function readHash(){
  if (!location.hash.includes('access_token')) return null;
  const p = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, '', location.pathname + location.search);
  if (p.get('state') !== store.get('cg_state')) return { error: 'Connexion refusée (vérification de sécurité). Réessaie.' };
  store.del('cg_state');
  return { token: p.get('access_token') };
}
function showLogin(msg){
  $('#loginView').classList.remove('hidden'); $('#appView').classList.add('hidden'); $('#who').classList.add('hidden');
  const m = $('#loginMsg'); if (msg) { m.textContent = msg; m.classList.remove('hidden'); } else m.classList.add('hidden');
}
function logout(msg){ token = null; store.del('cg_token'); showLogin(msg); }

async function boot(){
  $('#loginBtn').onclick = startLogin;
  $('#logout').onclick = () => logout();
  const h = readHash();
  if (h?.error) return showLogin(h.error);
  token = h?.token || store.get('cg_token');
  if (!token) return showLogin();
  try {
    me = await api('/admin/whoami', {});
    if (!me.permissions) me.permissions = Object.fromEntries([...Object.values(PERM_OF), 'delete_games'].map(k => [k, true])); // ancien serveur : propriétaire uniquement
    store.set('cg_token', token);
    $('#whoName').textContent = me.name; $('#who').classList.remove('hidden');
    $('#loginView').classList.add('hidden'); $('#appView').classList.remove('hidden');
    buildTabs(); await load(); if (me.isOwner) await loadAdmins(); render();
  } catch (e) {
    if (e.status === 403) logout("Ce compte Discord n'est pas autorisé à modifier le catalogue.");
    else if (e.status === 401) logout('Ta session a expiré. Reconnecte-toi.');
    else showLogin('Impossible de joindre le serveur. Réessaie dans un instant.');
  }
}

function buildTabs(){
  const TABS = visibleTabs();
  if (!TABS.includes(current)) current = TABS[0];
  $('#tabs').innerHTML = TABS.map(c => `<button type="button" class="tab" data-c="${c}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${CATS[c].icon}</svg>
    <span>${esc(CATS[c].name)}</span><span class="n" id="n-${c}"></span></button>`).join('');
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { current = b.dataset.c; filter = ''; shown = PAGE; selMode = false; picked.clear(); $('#search').value = ''; render(); });
  $('#addBtn').onclick = () => openForm();
  $('#autoBtn').onclick = () => openAutofill();
  $('#selBtn').onclick = () => { selMode = true; picked.clear(); render(); };
  $('#selCancel').onclick = () => { selMode = false; picked.clear(); render(); };
  $('#refresh').onclick = async () => { await load(); render(); toast('Catalogue actualisé.'); };
  $('#search').oninput = e => { filter = e.target.value.trim().toLowerCase(); shown = PAGE; render(); };
  $('#viewTgl').querySelectorAll('button').forEach(b => b.onclick = () => setView(b.dataset.v));
}
function setView(v){
  if (v === view) return;
  const run = () => { view = v; try { localStorage.setItem('cg_admin_view', v); } catch {} render(); };
  const li = [...document.querySelectorAll('#list li')];
  const vt = document.startViewTransition && !document.body.classList.contains('no-anim') && !(matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  if (!vt || !li.length) { run(); return; }
  // seuls les éléments visibles à l'écran glissent (beaucoup plus fluide que d'animer les 20 d'un coup)
  vtSet = new Set();
  li.forEach((el, i) => { const r = el.getBoundingClientRect(); if (r.bottom > 0 && r.top < innerHeight) { vtSet.add(i); el.style.viewTransitionName = 'vt' + i; } });
  vtOn = true; document.documentElement.classList.add('vting');
  const t = document.startViewTransition(run);
  t.finished.finally(() => { vtOn = false; document.documentElement.classList.remove('vting'); document.querySelectorAll('#list li').forEach(el => el.style.viewTransitionName = ''); });
}
function render(){
  const cfg = CATS[current];
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.c === current));
  ORDER.forEach(c => { const el = $('#n-' + c); if (el) el.textContent = (catalog.items[c] || []).filter(i => i._status !== 'deleted').length; });
  
  $('#catTitle').textContent = cfg.title; $('#catDesc').textContent = cfg.desc;
  const isAdmins = current === 'admins';
  $('#adminsView').classList.toggle('hidden', !isAdmins);
  if (isAdmins) {
    ['.bar', '#list', '#homeView', '#empty', '#pend'].forEach(q => $(q).classList.add('hidden'));
    renderAdmins(); return;
  }
  const isHome = current === 'home';
  $('.bar').classList.toggle('hidden', isHome); $('#list').classList.toggle('hidden', isHome); $('#homeView').classList.toggle('hidden', !isHome);
  if (isHome) { $('#empty').classList.add('hidden'); renderHome(); renderPending(); return; }
  const canManage = !!(me && me.permissions && me.permissions[PERM_OF[current]]);
  const canDel = !!(me && me.permissions && me.permissions.delete_games);
  $('#addBtn').classList.toggle('hidden', !canManage);
  $('#autoBtn').classList.toggle('hidden', !canManage);
  if (!canDel && !canManage) { selMode = false; picked.clear(); }
  const all = (catalog.items[current] || []).slice().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  const items = filter ? all.filter(i => (i.title || '').toLowerCase().includes(filter)) : all;
  const vis = items.slice(0, shown);
  $('#list').classList.toggle('grid', view === 'grid'); $('#list').classList.toggle('media', current === 'media');
  $('#viewTgl').querySelectorAll('button').forEach(b => { const on = b.dataset.v === view; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  $('#list').innerHTML = vis.map((it, i) => {
    const img = safeUrl(it.coverUrl);
    const st = ({ new: ['Nouveau', ''], edited: ['Modifié', ''], deleted: ['Suppression', ' del'] })[it._status];
    const canPick = selMode && it._status !== 'deleted';
    return `<li class="${it._status === 'deleted' ? 'isdel' : ''}${canPick ? ' selectable' : ''}${picked.has(it.id) ? ' picked' : ''}${freshFrom >= 0 && i >= freshFrom ? ' fresh' : ''}" style="${vtOn && vtSet.has(i) ? 'view-transition-name:vt' + i + ';' : ''}--d:${Math.max(0, i - freshFrom)}" ${canPick ? `data-p="${esc(it.id)}"` : ''}>${selMode ? `<input type="checkbox" class="rowchk" ${canPick ? '' : 'disabled'} ${picked.has(it.id) ? 'checked' : ''} tabindex="-1">` : ''}<span class="idx">${String(i + 1).padStart(2, '0')}</span>
      ${img ? `<img class="thumb" src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">` : '<span class="thumb"></span>'}
      <div class="ttl"><b>${esc(it.title)}${st ? `<i class="st${st[1]}">${st[0]}</i>` : ''}</b><span>${esc(cfg.sub(it)) || '&nbsp;'}</span></div>
      ${selMode ? '' : `<div class="acts">${canManage ? `<button class="ghost sm" type="button" data-e="${esc(it.id)}">Modifier</button>` : ''}
      ${canDel ? `<button class="ghost sm danger" type="button" data-d="${esc(it.id)}">Supprimer</button>` : ''}</div>`}</li>`;
  }).join('');
  freshFrom = -1;
  // chargement des contenus par 20 (pas de vraies pages)
  const left = items.length - vis.length, more = $('#more');
  more.classList.toggle('hidden', left <= 0);
  more.innerHTML = left > 0 ? `<button class="ghost" id="moreBtn" type="button">Charger ${Math.min(PAGE, left)} de plus<small>(${left} restant${left > 1 ? 's' : ''})</small></button><span class="mcnt">${vis.length} / ${items.length} affichés</span>` : '';
  if (left > 0) $('#moreBtn').onclick = () => { freshFrom = vis.length; shown += PAGE; render(); };
  $('#list').querySelectorAll('[data-e]').forEach(b => b.onclick = () => openForm(all.find(x => x.id === b.dataset.e)));
  $('#list').querySelectorAll('[data-d]').forEach(b => b.onclick = () => confirmDelete(all.find(x => x.id === b.dataset.d)));
  // Mode sélection : cocher plusieurs contenus, puis supprimer d'un coup
  const pickable = vis.filter(i => i._status !== 'deleted');
  [...picked].forEach(id => { if (!all.some(x => x.id === id && x._status !== 'deleted')) picked.delete(id); });
  $('#selBtn').classList.toggle('hidden', selMode || !(canDel || canManage));
  $('#selbar').classList.toggle('hidden', !selMode);
  $('#selcnt').textContent = picked.size + ' sélectionné' + (picked.size > 1 ? 's' : '');
  $('#selDel').disabled = picked.size === 0; $('#selDel').classList.toggle('hidden', !canDel);
  $('#selAnn').disabled = picked.size === 0; $('#selAnn').classList.toggle('hidden', !canManage);
  const pendSel = all.filter(x => picked.has(x.id) && (x._status === 'new' || x._status === 'edited'));
  $('#selPub').disabled = pendSel.length === 0; $('#selPub').classList.toggle('hidden', !canManage);
  $('#selPub').onclick = () => confirmPublishSel(pendSel);
  $('#selAll').textContent = pickable.length > 0 && pickable.every(i => picked.has(i.id)) ? 'Tout désélectionner' : 'Tout sélectionner';
  $('#list').querySelectorAll('[data-p]').forEach(li => li.onclick = () => { const id = li.dataset.p; picked.has(id) ? picked.delete(id) : picked.add(id); render(); });
  $('#selAll').onclick = () => { const allOn = pickable.length > 0 && pickable.every(i => picked.has(i.id)); pickable.forEach(i => allOn ? picked.delete(i.id) : picked.add(i.id)); render(); };
  $('#selDel').onclick = () => confirmDeleteMany(all.filter(x => picked.has(x.id)));
  $('#selAnn').onclick = () => confirmAnnounceMany(all.filter(x => picked.has(x.id)));
  renderPending();
  const empty = $('#empty');
  empty.classList.toggle('hidden', items.length > 0);
  empty.innerHTML = filter ? '<b>Aucun résultat</b>Aucun contenu ne correspond à cette recherche.'
    : `<b>Rien pour l'instant</b>Clique sur « Ajouter » pour publier ton premier contenu dans « ${esc(cfg.name)} ».`;
}

function renderHome(){
  // Tous les contenus (jeux, logiciels, packs, films, séries, animés), repérés par « catégorie:id »
  const kindOf = (c, i) => c === 'games' ? 'Jeu' : c === 'software' ? 'Logiciel' : c === 'graphics' ? 'Pack graphique' : ({ serie: 'Série', anime: 'Animé' })[i.type] || 'Film';
  const all = ORDER.flatMap(c => (catalog.items[c] || []).filter(i => i._status !== 'deleted').map(i => ({ ...i, _cat: c, _key: c + ':' + i.id, _kind: kindOf(c, i) })));
  const home = catalog.home || { hero: [], recent: [] };
  const SECS = [
    ['hero', 'Slider', 'Les grands visuels en haut de l\'accueil (8 contenus maximum, dans l\'ordre choisi). Jeux, logiciels, films, séries, animés ou packs.', 8],
    ['recent', 'Ajouts récents', 'La liste « Ajouts récents » de l\'accueil (20 contenus maximum, dans l\'ordre choisi). Tous types de contenu.', 20],
  ];
  $('#homeView').innerHTML = SECS.map(([key, title, desc, max]) => {
    const ids = home[key] || [];
    const rows = ids.map(k => all.find(g => g._key === k)).filter(Boolean);
    const free = all.filter(g => !ids.includes(g._key));
    const groups = ORDER.map(c => [c, free.filter(g => g._cat === c)]).filter(([, l]) => l.length);
    return `<section class="hsec"><h3>${esc(title)}</h3><p class="sub">${esc(desc)}</p>
      ${rows.length ? `<ol class="list">${rows.map((g, i) => {
        const img = safeUrl(g.coverUrl);
        return `<li><span class="idx">${String(i + 1).padStart(2, '0')}</span>
          ${img ? `<img class="thumb" src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">` : '<span class="thumb"></span>'}
          <div class="ttl"><b>${esc(g.title)}<i class="st" style="color:#7dd3fc;background:#0ea5e91f;border-color:#0ea5e955">${esc(g._kind)}</i></b><span>${esc(CATS[g._cat].sub(g)) || '&nbsp;'}</span></div>
          <div class="acts"><button class="ghost sm" type="button" data-h="${key}" data-up="${i}"${i === 0 ? ' disabled' : ''} aria-label="Monter">↑</button>
          <button class="ghost sm" type="button" data-h="${key}" data-down="${i}"${i === rows.length - 1 ? ' disabled' : ''} aria-label="Descendre">↓</button>
          <button class="ghost sm danger" type="button" data-h="${key}" data-rm="${esc(g._key)}">Retirer</button></div></li>`;
      }).join('')}</ol>` : `<div class="auto"><b>Automatique</b><br>Les derniers contenus publiés sont affichés. Ajoute des contenus ci-dessous pour choisir toi-même.</div>`}
      <div class="hadd">
        <select class="fi" data-add="${key}"${rows.length >= max || !free.length ? ' disabled' : ''}><option value="">${rows.length >= max ? 'Maximum atteint' : free.length ? '+ Ajouter un contenu…' : 'Aucun autre contenu'}</option>${groups.map(([c, l]) => `<optgroup label="${esc(CATS[c].name)}">${l.map(g => `<option value="${esc(g._key)}">${esc(g.title)}${g._cat === 'media' ? ' (' + esc(g._kind) + ')' : ''}</option>`).join('')}</optgroup>`).join('')}</select>
        ${rows.length ? `<button class="ghost sm" type="button" data-h="${key}" data-auto="1">Revenir à l'automatique</button>` : ''}
      </div></section>`;
  }).join('');
  const h = $('#homeView');
  const saveHome = async (key, ids) => {
    try {
      const r = await api('/admin/home', { [key]: ids });
      catalog = { version: r.version, items: r.items, pending: r.pending, home: r.home }; render();
      toast('Enregistré en brouillon. Clique sur « Publier » pour le mettre en ligne.');
    } catch (ex) { if (ex.status === 401) logout('Ta session a expiré. Reconnecte-toi.'); else toast(ex.message, true); }
  };
  h.querySelectorAll('[data-add]').forEach(sel => sel.onchange = () => { if (sel.value) saveHome(sel.dataset.add, [...(home[sel.dataset.add] || []), sel.value]); });
  h.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => saveHome(b.dataset.h, (home[b.dataset.h] || []).filter(x => x !== b.dataset.rm)));
  h.querySelectorAll('[data-auto]').forEach(b => b.onclick = () => saveHome(b.dataset.h, []));
  const move = (b, d) => { const k = b.dataset.h, a = [...(home[k] || [])], i = Number(d === -1 ? b.dataset.up : b.dataset.down), j = i + d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; saveHome(k, a); };
  h.querySelectorAll('[data-up]').forEach(b => b.onclick = () => move(b, -1));
  h.querySelectorAll('[data-down]').forEach(b => b.onclick = () => move(b, 1));
}

function announceFor(cat, list, kind){
  if (!list.length) return [];
  if (cat === 'games') {
    const k = kind || 'games_added', out = [];
    for (const sony of [false, true]) { const grp = list.filter(g => aSony(g) === sony); if (grp.length) out.push({ kind: k, sony, items: grp.map(aGame) }); }

  if (cat === 'software') return [{ kind: 'software_added', items: list.map(aSoft) }];

    ...announceFor('games', by('games', 'edited'), 'games_updated'),

async function sendAnnounce(reqs){
  if (!reqs.length) return '';
  let sent = 0; const errs = [];
  for (const r of reqs) {
    try {
      const res = await fetch(AVIS_URL + '/announce', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ accessToken: token, ...r }) });
      if (res.ok) sent++; else errs.push((await res.json().catch(() => ({}))).error || 'erreur ' + res.status);
    } catch { errs.push('serveur injoignable'); }
  }
  return errs.length ? `Annonce Discord non envoyée : ${errs[0]}` : `Annonce${sent > 1 ? 's' : ''} Discord envoyée${sent > 1 ? 's' : ''} (${sent}).`;
}

function fieldHtml(f, item){
  const v = item?.[f.k]; const id = 'f_' + f.k;
  const lab = `<label class="f" for="${id}">${esc(f.l)}${f.req ? ' <i>*</i>' : ''}</label>`;
  let ctl = '';
  if (f.t === 'area') ctl = `<textarea class="fi" id="${id}" name="${f.k}">${esc(v)}</textarea>`;
  else if (f.t === 'select') ctl = `<select class="fi" id="${id}" name="${f.k}">${f.opts.map(([val, lbl]) => `<option value="${esc(val)}"${v === val ? ' selected' : ''}>${esc(lbl)}</option>`).join('')}</select>`;
  else if (f.t === 'checks') ctl = `<div class="checks" data-k="${f.k}">${f.opts.map(o => `<label class="chk"><input type="checkbox" value="${esc(o)}"${(v || []).includes(o) ? ' checked' : ''}> ${esc(o)}</label>`).join('')}</div>`;
  else if (f.t === 'bool') return `<div class="free"><label class="chk"><input type="checkbox" name="${f.k}"${v ? ' checked' : ''}> ${esc(f.l)}</label></div>`;
  else ctl = `<input class="fi" id="${id}" name="${f.k}" type="${f.t === 'number' ? 'number' : f.t === 'url' ? 'url' : 'text'}"${f.step ? ` step="${f.step}"` : ''}${f.t === 'number' ? ' min="0"' : ''} value="${esc(v ?? '')}" placeholder="${esc(f.ph || (f.t === 'url' ? 'https://…' : ''))}" autocomplete="off">`;
  const prev = f.img ? `<img class="imgprev ${safeUrl(v) ? '' : 'hidden'}" data-prev="${f.k}" src="${esc(safeUrl(v))}" alt="" referrerpolicy="no-referrer">` : '';
  return `<div class="${f.full ? 'full' : ''}">${lab}${ctl}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}${prev}</div>`;
}

  setTimeout(() => $('#af_url')?.focus(), 30);
}
function confirmDelete(item){
  if (!item) return;
  $('#modalHost').innerHTML = `<div class="overlay" id="ov"><div class="modal sm2">
    <div class="mh"><h3>Supprimer ?</h3></div>
    <div style="padding:20px 22px;font-size:14px;line-height:1.6;color:#ffffffb3">« ${esc(item.title)} » sera retiré de l'application pour tout le monde une fois que tu auras cliqué sur « Publier ».</div>
    <div class="mf"><button class="ghost" type="button" id="cancel">Annuler</button><button class="cta" type="button" id="yes" style="background:#f43f5e;color:#fff">Supprimer</button></div></div></div>`;
  const close = () => { $('#modalHost').innerHTML = ''; };
  $('#cancel').onclick = close;
  $('#yes').onclick = async () => {
    try { const r = await api('/admin/delete', { category: current, id: item.id }); catalog = { version: r.version, items: r.items, pending: r.pending, home: r.home }; close(); render(); toast('Suppression enregistrée. Clique sur « Publier » pour l\'appliquer.'); }
    catch (ex) { close(); if (ex.status === 401) logout('Ta session a expiré. Reconnecte-toi.'); else toast(ex.message, true); }
  };
}
function confirmDeleteMany(list){
  if (!list.length) return;
  const names = list.slice(0, 8).map(i => `<li>${esc(i.title)}</li>`).join('') + (list.length > 8 ? `<li>… et ${list.length - 8} autre(s)</li>` : '');
  $('#modalHost').innerHTML = `<div class="overlay" id="ov"><div class="modal sm2">
    <div class="mh"><h3>Supprimer ${list.length} contenu${list.length > 1 ? 's' : ''} ?</h3></div>
    <div style="padding:20px 22px;font-size:14px;line-height:1.6;color:#ffffffb3">Ces contenus seront retirés de l'application pour tout le monde une fois que tu auras cliqué sur « Publier » :<ul style="margin:10px 0 0;padding-left:20px">${names}</ul></div>
    <div class="mf"><button class="ghost" type="button" id="cancel">Annuler</button><button class="cta" type="button" id="yes" style="background:#f43f5e;color:#fff">Supprimer</button></div></div></div>`;
  const close = () => { $('#modalHost').innerHTML = ''; };
  $('#cancel').onclick = close;
  $('#yes').onclick = async () => {
    $('#yes').disabled = true; let done = 0;
    try {
      for (const it of list) {
        const r = await api('/admin/delete', { category: current, id: it.id });
        catalog = { version: r.version, items: r.items, pending: r.pending, home: r.home }; done++;
      }
      selMode = false; picked.clear(); close(); render(); toast(done + ' suppression' + (done > 1 ? 's enregistrées' : ' enregistrée') + '. Clique sur « Publier » pour l\'appliquer.');
    } catch (ex) {
      close(); if (ex.status === 401) { logout('Ta session a expiré. Reconnecte-toi.'); return; }
      picked.clear(); render(); toast((done ? done + ' supprimé(s), puis erreur : ' : '') + ex.message, true);
    }
  };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#modalHost').innerHTML = ''; });
